name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libusb-1.0-0-dev \
            cmake

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install libusb cmake

      - name: Install libusb via vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install libusb:x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_SHARED_LIBS=ON \
            -DMVCI_BUILD_TESTS=ON \
            -DMVCI_BUILD_EXAMPLES=ON \
            ${CMAKE_TOOLCHAIN_FILE:+-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TOOLCHAIN_FILE}}

      - name: Build
        shell: bash
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run tests
        shell: bash
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Configure for packaging (no tests/examples for clean distributable)
        shell: bash
        run: |
          cmake -S . -B build-package \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_SHARED_LIBS=ON \
            -DMVCI_BUILD_TESTS=OFF \
            -DMVCI_BUILD_EXAMPLES=OFF \
            ${CMAKE_TOOLCHAIN_FILE:+-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TOOLCHAIN_FILE}}

      - name: Build for packaging
        shell: bash
        run: cmake --build build-package --config ${{ matrix.build_type }} --parallel

      - name: Install to staging directory (for artifacts)
        shell: bash
        run: cmake --install build-package --config ${{ matrix.build_type }} --prefix package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openmvci-${{ matrix.os }}-${{ matrix.build_type }}
          path: package/
          retention-days: 30
          if-no-files-found: error
